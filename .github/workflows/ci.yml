name: CI

# Every push and PR gets a real build + unit-test run, so the Filc redesign
# (and anything after it) can never land in a non-compiling state.
on:
  push:
    branches:
      - '**'
  pull_request:
  workflow_dispatch:
    inputs:
      update_golden:
        description: 'A Roborazzi golden screenshot (greeting.png) frissítése'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Restore Gradle caches
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.gradle/android
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', 'gradle/libs.versions.toml', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # --no-configuration-cache: a Roborazzi + KSP feladat sorozat a
      # konfigurációs gyorsítótárral CI-ben néha furán viselkedik; így a
      # futtatás végig predictable marad.
      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug --stacktrace --no-configuration-cache --warning-mode=summary

      - name: Assemble instrumentation test APK (compile-only check)
        run: ./gradlew :app:assembleDebugAndroidTest --stacktrace --no-configuration-cache

      - name: Unit tests (Robolectric + Roborazzi)
        run: ./gradlew :app:testDebugUnitTest --stacktrace --no-configuration-cache --continue

      - name: Summarize test results
        if: always()
        run: |
          python3 - <<'PY'
          import glob, os, xml.etree.ElementTree as ET

          rows, failed = [], []
          for path in sorted(glob.glob('app/build/test-results/testDebugUnitTest/*.xml')):
              root = ET.parse(path).getroot()
              tests = int(root.get('tests', 0) or 0)
              problems = int(root.get('failures', 0) or 0) + int(root.get('errors', 0) or 0)
              skipped = int(root.get('skipped', 0) or 0)
              rows.append(f"| {root.get('name')} | {tests} | {problems} | {skipped} |")
              for case in root.iter('testcase'):
                  for tag in ('failure', 'error'):
                      node = case.find(tag)
                      if node is not None:
                          msg = (node.get('message') or '').strip().replace('\n', ' ')[:400]
                          failed.append(f"**{root.get('name')}.{case.get('name')}** — {tag}: {msg}")

          lines = ['## Unit tesztek', '', '| Osztály | teszt | hiba | kihagyott |', '|---|---|---|---|', *rows, '']
          if failed:
              lines += ['### Bukások', *[f'- {entry}' for entry in failed]]
          else:
              lines += ['✅ Minden unit teszt zöld.']

          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as handle:
              handle.write('\n'.join(lines) + '\n')
          PY

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: |
            app/build/reports/tests/
            app/build/test-results/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload recorded screenshots (Roborazzi)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: roborazzi-screenshots
          path: |
            app/build/roborazzi/
            app/src/test/screenshots/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      # Csak kézi indításkor, explicit kéréskor: a felvett új golden kép
      # visszacommittolása a branchre.
      - name: Commit updated golden screenshot
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.update_golden && success() }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- app/src/test/screenshots; then
            echo "A golden kép nem változott."
          else
            git add app/src/test/screenshots
            git commit -m "test: frissített Roborazzi golden a Filc arculathoz"
            git push origin HEAD:${{ github.ref_name }}
          fi
