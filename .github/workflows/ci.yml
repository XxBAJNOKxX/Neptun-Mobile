name: CI – Build & Test

on:
  push:
    branches:
      - main
      - 'arena/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Unit tesztek, lint és build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Unit tesztek futtatása
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Unit teszt eredmények feltöltése
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: app/build/reports/tests/**
          if-no-files-found: ignore

      - name: Lint ellenőrzés
        run: ./gradlew lintDebug --stacktrace

      - name: Debug APK buildelése
        run: ./gradlew assembleDebug --stacktrace

      - name: Release APK buildelése (R8 minify)
        run: ./gradlew assembleRelease --stacktrace

      - name: APK artifactok feltöltése
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apk-artifacts
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
          if-no-files-found: ignore
