name: CI

# Minden push és PR valódi buildet + unit teszt futást kap, hogy a Filc
# arculat (és bármi utána) soha ne kerülhessen olyan állapotba, ami nem fordul.
on:
  push:
    branches:
      - '**'
  pull_request:
  workflow_dispatch:
    inputs:
      update_golden:
        description: 'A Roborazzi golden screenshot (greeting.png) frissítése'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # A gradle.properties-ben bekapcsolt in-process Kotlin fordító ütközik a
  # KSP2-vel (ApplicationManager.getApplication() null), CI-n ezért a
  # dokumentált daemon stratégiára váltunk, nagyobb heap-pel.
  GRADLE_ARGS: >-
    --stacktrace --no-configuration-cache --warning-mode=summary
    -Pkotlin.compiler.execution.strategy=daemon
    -Pkotlin.daemon.jvmargs=-Xmx3g
  LOG_DIR: ci-logs

jobs:
  build-and-test:
    name: Build & unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Restore Gradle caches
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.gradle/android
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', 'gradle/libs.versions.toml', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Assemble debug APK
        shell: bash
        run: mkdir -p "$LOG_DIR" && ./gradlew :app:assembleDebug $GRADLE_ARGS 2>&1 | tee "$LOG_DIR/assemble.log"

      - name: Assemble instrumentation test APK (compile-only check)
        shell: bash
        run: ./gradlew :app:assembleDebugAndroidTest $GRADLE_ARGS 2>&1 | tee "$LOG_DIR/androidtest.log"

      - name: Unit tests (Robolectric + Roborazzi)
        shell: bash
        run: ./gradlew :app:testDebugUnitTest $GRADLE_ARGS --continue 2>&1 | tee "$LOG_DIR/tests.log"

      # A nyers CI-naplót ebből a sandboxból nem lehet letölteni (a futási
      # naplókat tároló távoli host el van vágva), ezért a lényeget
      # annotációként és a commit kommentjeként is visszaírjuk: az
      # `gh api .../commits/<sha>/comments` végpont így is elérhető.
      - name: Report failures (annotations + commit comment)
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          grep -hE "^e: |^> Task .*FAILED|What went wrong|^Caused by:" "$LOG_DIR"/*.log 2>/dev/null \
            | sed "s|file:///home/runner/work/[^ ]*/app/src/|app/src/|g" \
            | sort -u > "$LOG_DIR/errors.txt" || true
          if [ ! -s "$LOG_DIR/errors.txt" ]; then
            tail -40 "$LOG_DIR"/*.log > "$LOG_DIR/errors.txt" 2>/dev/null || true
          fi
          echo '### Fordítási hibák'
          cat "$LOG_DIR/errors.txt"
          head -45 "$LOG_DIR/errors.txt" | while IFS= read -r line; do
            printf '::error::%s\n' "$(printf '%s' "$line" | sed 's/%/%25/g' | cut -c1-300)"
          done
          {
            printf '## CI: fordítási hibák\n\ncommit %s\n\n```\n' "$GITHUB_SHA"
            cut -c1-400 "$LOG_DIR/errors.txt" | head -200
            printf '\n```\n'
          } > "$LOG_DIR/comment.md"
          gh api -X POST "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/comments" \
            -F "body=@$LOG_DIR/comment.md" > /dev/null || echo "(commit comment nem ment)"

      - name: Upload raw gradle logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-logs
          path: ci-logs/
          if-no-files-found: ignore
          retention-days: 14

      - name: Summarize test results
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          import glob, os, xml.etree.ElementTree as ET

          rows, failed = [], []
          for path in sorted(glob.glob('app/build/test-results/testDebugUnitTest/*.xml')):
              root = ET.parse(path).getroot()
              tests = int(root.get('tests', 0) or 0)
              problems = int(root.get('failures', 0) or 0) + int(root.get('errors', 0) or 0)
              skipped = int(root.get('skipped', 0) or 0)
              rows.append(f"| {root.get('name')} | {tests} | {problems} | {skipped} |")
              for case in root.iter('testcase'):
                  for tag in ('failure', 'error'):
                      node = case.find(tag)
                      if node is not None:
                          msg = (node.get('message') or '').strip().replace('\n', ' ')[:400]
                          failed.append(f"**{root.get('name')}.{case.get('name')}** — {tag}: {msg}")

          lines = ['## Unit tesztek', '', '| Osztály | teszt | hiba | kihagyott |', '|---|---|---|---|', *rows, '']
          if rows:
              lines += ['### Bukások', *[f'- {entry}' for entry in failed]] if failed else ['✅ Minden unit teszt zöld.']
          else:
              lines += ['⚠️ Nem született tesztredmény (a build korábban elhasalt).']

          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as handle:
              handle.write('\n'.join(lines) + '\n')
          PY

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: |
            app/build/reports/tests/
            app/build/test-results/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload recorded screenshots (Roborazzi)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: roborazzi-screenshots
          path: |
            app/build/roborazzi/
            app/src/test/screenshots/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      # Csak kézi indításkor, explicit kérésre: a felvett új golden kép
      # visszacommittolása a branchre.
      - name: Commit updated golden screenshot
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.update_golden && success() }}
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- app/src/test/screenshots; then
            echo "A golden kép nem változott."
          else
            git add app/src/test/screenshots
            git commit -m "test: frissített Roborazzi golden a Filc arculathoz"
            git push origin HEAD:"$GITHUB_REF_NAME"
          fi
